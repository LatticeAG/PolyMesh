name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update (for example, v0.3.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-package:
    name: Verify and package release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Verify release tag matches package versions
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Release tags must use vMAJOR.MINOR.PATCH" >&2; exit 1 ;;
          esac
          release_version="${RELEASE_TAG#v}"
          RELEASE_VERSION="$release_version" node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const expected = process.env.RELEASE_VERSION;
          const manifests = [
            "package.json",
            "packages/broker/package.json",
            "packages/client/package.json",
            "packages/gateway/package.json",
            "templategen/packages/create-polymesh-app/package.json",
          ];
          for (const manifest of manifests) {
            const version = JSON.parse(readFileSync(manifest, "utf8")).version;
            if (version !== expected) throw new Error(`${manifest} is ${version}, expected ${expected}`);
          }
          NODE
          python - "$release_version" <<'PY'
          import sys
          import tomllib

          expected = sys.argv[1]
          with open("pyproject.toml", "rb") as source:
              version = tomllib.load(source)["project"]["version"]
          if version != expected:
              raise SystemExit(f"pyproject.toml is {version}, expected {expected}")
          PY

      - name: Install TypeScript dependencies
        run: npm ci

      - name: Type-check TypeScript
        run: npm run typecheck

      - name: Build TypeScript packages from clean output
        shell: bash
        run: |
          rm -rf packages/broker/dist packages/client/dist packages/gateway/dist
          npm run build

      - name: Run TypeScript tests
        run: npm test

      - name: Pack npm workspaces
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/release/npm
          mkdir -p dist/release/npm
          npm pack --workspaces --pack-destination dist/release/npm --json > dist/release/npm/pack-manifest.json
          test -n "$(find dist/release/npm -maxdepth 1 -type f -name '*.tgz' -print -quit)"

      - name: Verify npm tarballs install cleanly
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$RUNNER_TEMP/polymesh-npm-smoke"
          rm -rf "$smoke_dir"
          mkdir -p "$smoke_dir"
          cd "$smoke_dir"
          npm init --yes >/dev/null
          npm install --omit=dev "$GITHUB_WORKSPACE"/dist/release/npm/*.tgz
          node --input-type=module <<'NODE'
          await import("@latticeag/polymesh-broker");
          await import("@latticeag/polymesh-client");
          await import("@latticeag/polymesh-gateway");
          NODE
          ./node_modules/.bin/polymesh help >/dev/null
          ./node_modules/.bin/create-polymesh-app --help >/dev/null

      - name: Synchronize Python development environment
        run: uv sync --dev --locked

      - name: Run Python tests
        run: uv run pytest -q

      - name: Build Python distribution
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/release/python
          mkdir -p dist/release/python
          uv build --out-dir dist/release/python
          test -n "$(find dist/release/python -maxdepth 1 -type f -name '*.whl' -print -quit)"

      - name: Scan release artifact contents
        run: >-
          python scripts/verify_release_artifacts.py
          --npm-dir dist/release/npm
          --python-dir dist/release/python

      - name: Verify Python wheel installs cleanly
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find "$GITHUB_WORKSPACE"/dist/release/python -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          smoke_dir="$RUNNER_TEMP/polymesh-python-smoke"
          rm -rf "$smoke_dir"
          mkdir -p "$smoke_dir"
          uv venv "$smoke_dir/.venv" --python 3.12
          cd "$smoke_dir"
          env -u PYTHONPATH uv pip install --python "$smoke_dir/.venv/bin/python" "$wheel"
          env -u PYTHONPATH "$smoke_dir/.venv/bin/python" -c "import polymesh; print(polymesh.__name__)"
          env -u PYTHONPATH "$smoke_dir/.venv/bin/polymesh" --help >/dev/null

      - name: Verify shared vectors with packaged SDK artifacts
        shell: bash
        run: |
          set -euo pipefail
          env -u PYTHONPATH "$RUNNER_TEMP/polymesh-python-smoke/.venv/bin/python" \
            scripts/verify_cross_language_schema.py \
            --npm-root "$RUNNER_TEMP/polymesh-npm-smoke/node_modules" \
            --vectors-dir tests/compat

      - name: Upload release artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: release-artifacts
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/release/npm/*.tgz
            dist/release/python/*.whl

  publish-release:
    name: Attach artifacts to GitHub release
    needs: verify-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "Release tags must begin with v" >&2; exit 1 ;;
          esac
          shopt -s nullglob
          assets=(release-artifacts/npm/*.tgz release-artifacts/python/*.whl)
          test "${#assets[@]}" -gt 0
          if gh release view "$RELEASE_TAG" -R LatticeAG/PolyMesh >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber -R LatticeAG/PolyMesh
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --target "$GITHUB_SHA" --generate-notes -R LatticeAG/PolyMesh
          fi